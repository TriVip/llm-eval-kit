name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Run 64-case portfolio pass demo
        run: node apps/cli/dist/index.js run --config examples/ecommerce-support/llmeval.config.json --suite examples/ecommerce-support/suite.yaml --fixtures examples/ecommerce-support/fixtures.json
      - name: Verify judge calibration evidence
        run: node scripts/verify-calibration.mjs
      - name: Verify provider smoke policy without paid secrets
        run: node scripts/provider-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-pass-report
          path: reports/
          if-no-files-found: warn

  regression-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prove REFUND_001 regression blocks deployment
        shell: bash
        run: |
          set +e
          node apps/cli/dist/index.js run --config examples/ecommerce-support/llmeval.config.json --suite examples/ecommerce-support/suite.yaml --fixtures examples/ecommerce-support/fixtures-regression.json --case REFUND_001
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 1 ]; then
            echo "Expected quality-gate exit code 1, received $exit_code"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-regression-report
          path: reports/
          if-no-files-found: warn

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  studio-production:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm studio:verify

  studio-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm studio:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-browser-traces
          path: test-results/
          if-no-files-found: ignore
